CONFIG_APP_LOG_LEVEL=3

CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_VIDEO=y

CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_PRINTK=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_STD_CPP11=y

CONFIG_BUILD_OUTPUT_HEX=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NO_OPTIMIZATIONS=n
CONFIG_MAIN_STACK_SIZE=16000
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=8096

CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# using Picolib has errors compiling C++ math
CONFIG_NEWLIB_LIBC=y






CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_LOG=y
CONFIG_LOG=y

CONFIG_SLIP_STATISTICS=n
CONFIG_NET_SHELL=y

CONFIG_STD_C99=n
CONFIG_STD_C11=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y
